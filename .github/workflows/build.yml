# Builds the Windows installer for every published release and attaches
# UGC-Trend-Finder-Setup.exe to it. Installed apps update from that file.
name: Build installer

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Write version info
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          if (-not $tag) { $tag = "v0.0.0" }
          $ver = $tag.TrimStart('v', 'V')
          @{ version = $ver; repo = "${{ github.repository }}" } | ConvertTo-Json | Set-Content -Path src/build_info.json -Encoding utf8
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-Content src/build_info.json

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller pywebview pystray pillow

      - name: Draw the app icon
        working-directory: src
        run: python make_icons.py

      - name: Build the app
        working-directory: src
        run: >-
          pyinstaller --noconfirm --clean --windowed
          --name "UGC Trend Finder" --icon icon.ico
          --add-data "ui;ui" --add-data "icon.png;." --add-data "icon.ico;." --add-data "build_info.json;."
          --hidden-import pystray._win32 --collect-all webview
          app.py

      - name: Build the installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:APP_VERSION" installer\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Attach installer to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "Output/UGC-Trend-Finder-Setup.exe" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: UGC-Trend-Finder-Setup
          path: Output/UGC-Trend-Finder-Setup.exe
