<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UGC Trend Finder</title>
<style>
:root, [data-theme="midnight"] {
  --bg: #0f1115; --side: #13161b; --card: #181b21; --card2: #1e222a; --soft: #232731; --soft2: #2b303b;
  --line: #262a33; --line2: #343a46; --ink: #e8eaee; --ink2: #b8bec9; --muted: #7f8795;
  --accent: #4a86f0; --accent2: #6d9ff6; --accent-deep: #3d78e6; --accent-dim: #1a2538; --accent-line: #2a3c5c;
  --accent-rgb: 74,134,240; --on-accent: #ffffff; --chip-on-bg: #e8eaee; --chip-on-ink: #111318;
  --log-bg: #111318; --img1: #252b36; --img2: #171a20; --ph: #3a414d; --nav-hover: #1a1e25; --switch-off: #3a404c;
  --thumb: #2b303a; --thumb-h: #3a414e; --overlay: rgba(6,8,11,.62); --shadow: rgba(0,0,0,.45); --rank-bg: rgba(15,17,21,.75);
  --ok: #4fd08a; --ok-bg: rgba(79,208,138,.12); --gap: #a98bfa; --gap-bg: rgba(169,139,250,.13);
  --warn: #f2bb4a; --warn-bg: rgba(242,187,74,.12); --danger: #f27878; --danger-bg: rgba(242,120,120,.12);
  --r: 12px; --r-sm: 8px;
  --font: "Segoe UI Variable Text", "Segoe UI", Inter, system-ui, -apple-system, sans-serif;
  --font-d: "Segoe UI Variable Display", "Segoe UI", Inter, system-ui, sans-serif;
  --mono: "Cascadia Mono", Consolas, ui-monospace, monospace;
  color-scheme: dark;
}
[data-theme="sakura"] {
  --bg: #151015; --side: #1a1219; --card: #211720; --card2: #2a1d28; --soft: #2e2130; --soft2: #3a2a3b;
  --line: #332532; --line2: #45323f; --ink: #f7ecf2; --ink2: #dcc2d2; --muted: #a3879b;
  --accent: #ff5fa2; --accent2: #ff8cc0; --accent-deep: #f0458f; --accent-dim: #3b1a2d; --accent-line: #5c2a46;
  --accent-rgb: 255,95,162; --on-accent: #ffffff; --chip-on-bg: #ffd3e6; --chip-on-ink: #2a0f1d;
  --log-bg: #120c12; --img1: #36222f; --img2: #1c131b; --ph: #5a3f52; --nav-hover: #241823; --switch-off: #4a3646;
  --thumb: #3a2a37; --thumb-h: #4d3848; --rank-bg: rgba(26,18,25,.78); --gap: #c9a2ff;
}
[data-theme="emerald"] {
  --bg: #0d1311; --side: #111815; --card: #151e1a; --card2: #1b2621; --soft: #1f2b25; --soft2: #283630;
  --line: #22302a; --line2: #2f3f37; --ink: #e6efe9; --ink2: #b6c8bd; --muted: #7b9186;
  --accent: #2fbf7f; --accent2: #55d69b; --accent-deep: #23a86c; --accent-dim: #13291f; --accent-line: #1f4a35;
  --accent-rgb: 47,191,127; --on-accent: #ffffff; --chip-on-bg: #e6efe9; --chip-on-ink: #0d1311;
  --log-bg: #0b100e; --img1: #1f2c26; --img2: #121a16; --ph: #36483f; --nav-hover: #16201b; --switch-off: #34443c;
  --thumb: #283630; --thumb-h: #35463e; --rank-bg: rgba(13,19,17,.78);
}
[data-theme="sunset"] {
  --bg: #14100d; --side: #1a1511; --card: #211a15; --card2: #2a211b; --soft: #2e241d; --soft2: #3a2e25;
  --line: #33291f; --line2: #45382c; --ink: #f4ede7; --ink2: #d6c6b9; --muted: #9e8c7e;
  --accent: #ff8a3d; --accent2: #ffa66b; --accent-deep: #f07424; --accent-dim: #3a2415; --accent-line: #5c3a20;
  --accent-rgb: 255,138,61; --on-accent: #ffffff; --chip-on-bg: #f4ede7; --chip-on-ink: #1a1511;
  --log-bg: #110d0a; --img1: #33271e; --img2: #1b1511; --ph: #54433a; --nav-hover: #231c16; --switch-off: #4a3c31;
  --thumb: #3a2e25; --thumb-h: #4b3c30; --rank-bg: rgba(26,21,17,.78);
}
[data-theme="violet"] {
  --bg: #100f16; --side: #15131d; --card: #1b1925; --card2: #22202e; --soft: #262335; --soft2: #302c42;
  --line: #2a2738; --line2: #38344a; --ink: #ece9f6; --ink2: #c3bdd9; --muted: #8a84a3;
  --accent: #8b6cff; --accent2: #a78fff; --accent-deep: #7657f0; --accent-dim: #231d3d; --accent-line: #3b2f6b;
  --accent-rgb: 139,108,255; --on-accent: #ffffff; --chip-on-bg: #ece9f6; --chip-on-ink: #15131d;
  --log-bg: #0e0d14; --img1: #2a2638; --img2: #17151f; --ph: #463f5c; --nav-hover: #1d1a28; --switch-off: #3d3852;
  --thumb: #302c42; --thumb-h: #3e3955; --rank-bg: rgba(21,19,29,.78); --gap: #e59bff;
}
[data-theme="graphite"] {
  --bg: #111111; --side: #161616; --card: #1c1c1c; --card2: #232323; --soft: #272727; --soft2: #313131;
  --line: #2a2a2a; --line2: #3a3a3a; --ink: #ededed; --ink2: #c2c2c2; --muted: #8a8a8a;
  --accent: #e8e8e8; --accent2: #ffffff; --accent-deep: #cfcfcf; --accent-dim: #2c2c2c; --accent-line: #444444;
  --accent-rgb: 232,232,232; --on-accent: #111111; --chip-on-bg: #ededed; --chip-on-ink: #111111;
  --log-bg: #0e0e0e; --img1: #2a2a2a; --img2: #171717; --ph: #444444; --nav-hover: #1f1f1f; --switch-off: #3d3d3d;
  --thumb: #333333; --thumb-h: #444444; --rank-bg: rgba(17,17,17,.78);
}
[data-theme="daylight"] {
  --bg: #f4f5f8; --side: #ffffff; --card: #ffffff; --card2: #f3f5f8; --soft: #eef0f4; --soft2: #e3e7ee;
  --line: #e3e6eb; --line2: #d2d7df; --ink: #1a1d23; --ink2: #454c58; --muted: #7a828f;
  --accent: #3b7cf0; --accent2: #5a93f5; --accent-deep: #2f6de0; --accent-dim: #e5eefe; --accent-line: #c8dafc;
  --accent-rgb: 59,124,240; --on-accent: #ffffff; --chip-on-bg: #1a1d23; --chip-on-ink: #ffffff;
  --log-bg: #f3f5f8; --img1: #ffffff; --img2: #e8ebf0; --ph: #b7bec9; --nav-hover: #f1f3f6; --switch-off: #cbd1da;
  --thumb: #cfd4dc; --thumb-h: #b7bec9; --overlay: rgba(20,24,32,.35); --shadow: rgba(20,24,32,.16); --rank-bg: rgba(255,255,255,.88);
  --ok: #16a34a; --ok-bg: rgba(22,163,74,.1); --gap: #7c5cdb; --gap-bg: rgba(124,92,219,.1);
  --warn: #b7791f; --warn-bg: rgba(183,121,31,.1); --danger: #dc2626; --danger-bg: rgba(220,38,38,.08);
  color-scheme: light;
}
body, .side, .card, .stat, .btn, .chip, .nav button, .idea, .item, .input, .path, .status { transition: background-color .25s, border-color .25s, color .25s; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased;
  overflow: hidden; user-select: none; }
button { font: inherit; color: inherit; }
a { color: var(--accent2); text-decoration: none; }
a:hover { text-decoration: underline; }
::selection { background: rgba(var(--accent-rgb), .3); }
.selectable { user-select: text; }

/* scrollbars */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--thumb); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: var(--thumb-h); border: 3px solid transparent; background-clip: padding-box; }

/* layout */
.app { display: grid; grid-template-columns: 232px 1fr; height: 100vh; }
.side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; padding: 18px 12px 14px; }
.brand { display: flex; align-items: center; gap: 11px; padding: 2px 6px 20px; }
.logo { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(145deg, var(--accent2), var(--accent-deep)); color: var(--on-accent);
  display: grid; place-items: center; box-shadow: 0 4px 14px rgba(var(--accent-rgb),.25); flex: none; }
.brand b { display: block; font: 600 15px/1.2 var(--font-d); }
.brand span { font-size: 12px; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 9px 12px; border: 0; border-radius: 9px;
  background: transparent; color: var(--ink2); cursor: pointer; text-align: left; transition: background .15s, color .15s; }
.nav button:hover { background: var(--nav-hover); color: var(--ink); }
.nav button.active { background: var(--accent-dim); color: var(--ink); font-weight: 600; }
.nav button.active svg { color: var(--accent2); }
.nav svg { width: 18px; height: 18px; flex: none; }
.nav .badge { margin-left: auto; font-size: 11px; font-weight: 600; background: var(--accent); color: var(--on-accent); border-radius: 99px; padding: 0 7px; }
.side .grow { flex: 1; }
.status { margin-top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.status .row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); padding: 2px 0; }
.status .row b { color: var(--ink); font-weight: 600; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 7px; vertical-align: 1px; }
.dot.busy { background: var(--accent2); animation: pulse 1.2s infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(var(--accent-rgb),.35); } 50% { box-shadow: 0 0 0 5px transparent; } }
.mini-bar { height: 4px; background: var(--soft); border-radius: 4px; margin: 8px 0 2px; overflow: hidden; display: none; }
.mini-bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 4px; transition: width .4s; }
.status .btn { width: 100%; margin-top: 10px; }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.header { display: flex; align-items: center; gap: 16px; padding: 20px 28px 16px; border-bottom: 1px solid var(--line); flex: none; }
.header h1 { margin: 0; font: 600 21px/1.25 var(--font-d); letter-spacing: -.01em; }
.header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.header .actions { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; scroll-behavior: smooth; }
.page { display: none; padding: 22px 28px 32px; max-width: 1500px; }
.page.active { display: block; animation: fade .18s ease-out; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 16px; border-radius: 9px;
  border: 1px solid var(--line2); background: var(--soft); color: var(--ink); cursor: pointer; font-weight: 500; white-space: nowrap;
  transition: background .15s, border-color .15s, transform .08s, box-shadow .15s; }
.btn:hover { background: var(--soft2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.primary:hover { background: var(--accent2); border-color: var(--accent2); box-shadow: 0 4px 16px rgba(var(--accent-rgb),.25); }
.btn.danger { color: var(--danger); }
.btn.danger:hover { background: var(--danger-bg); border-color: rgba(242,120,120,.35); }
.btn.sm { height: 30px; padding: 0 12px; font-size: 13px; border-radius: 8px; }
.btn.lg { height: 42px; padding: 0 22px; font-size: 15px; }
.btn:disabled { opacity: .45; cursor: default; transform: none; box-shadow: none; }
.btn svg { width: 16px; height: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { height: 34px; padding: 0 15px; border-radius: 99px; border: 1px solid var(--line2); background: transparent; color: var(--ink2);
  cursor: pointer; transition: all .15s; }
.chip:hover { background: var(--soft); color: var(--ink); }
.chip.on { background: var(--chip-on-bg); border-color: var(--chip-on-bg); color: var(--chip-on-ink); font-weight: 600; }
.chip:disabled { opacity: .45; cursor: default; }
.toggle { display: flex; gap: 14px; align-items: flex-start; cursor: pointer; padding: 4px 0; }
.toggle .sw { width: 40px; height: 23px; border-radius: 99px; background: var(--switch-off); position: relative; flex: none; margin-top: 1px; transition: background .2s; }
.toggle .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 17px; height: 17px; border-radius: 50%; background: #fff;
  transition: transform .2s cubic-bezier(.3,.7,.4,1); box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.toggle.on .sw { background: var(--accent); }
[data-theme="graphite"] .toggle.on .sw::after { background: #111; }
.toggle.on .sw::after { transform: translateX(17px); }
.toggle.disabled { opacity: .45; cursor: default; }
.toggle b { font-weight: 500; display: block; }
.toggle small { color: var(--muted); font-size: 12.5px; }
.input { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 9px; background: var(--soft);
  border: 1px solid var(--line2); transition: border-color .15s, box-shadow .15s; }
.input:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb),.18); }
.input input { border: 0; outline: 0; background: transparent; color: var(--ink); font: inherit; width: 200px; }
.input input::placeholder { color: var(--muted); }
.input svg { width: 15px; height: 15px; color: var(--muted); flex: none; }

/* dropdown */
.dd { position: relative; }
.dd-menu { position: absolute; right: 0; top: calc(100% + 6px); min-width: 100%; max-height: 360px; overflow-y: auto; z-index: 30;
  background: var(--card); border: 1px solid var(--line2); border-radius: 10px; padding: 5px; box-shadow: 0 14px 40px var(--shadow);
  display: none; }
.dd.open .dd-menu { display: block; animation: fade .12s ease-out; }
.dd-menu button { display: block; width: 100%; text-align: left; padding: 8px 12px; border: 0; background: none; border-radius: 7px;
  cursor: pointer; white-space: nowrap; color: var(--ink2); }
.dd-menu button:hover { background: var(--soft); color: var(--ink); }
.dd-menu button.sel { color: var(--accent2); font-weight: 600; }
.chev { width: 14px; height: 14px; transition: transform .15s; }
.dd.open .chev { transform: rotate(180deg); }

/* cards */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); }
.card + .card { margin-top: 14px; }
.card-h { padding: 16px 20px 0; font-size: 11.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.card-b { padding: 14px 20px 20px; }
.field + .field { margin-top: 20px; }
.field > label { display: block; font-weight: 600; margin-bottom: 3px; }
.field > .hint { color: var(--muted); font-size: 12.5px; margin: 0 0 10px; }
.sec-title { display: flex; align-items: baseline; gap: 10px; margin: 26px 0 12px; }
.sec-title h2 { margin: 0; font: 600 16px/1.3 var(--font-d); }
.sec-title span { color: var(--muted); font-size: 13px; }
.sec-title:first-child { margin-top: 0; }

/* scan progress */
.prog-top { display: flex; align-items: center; gap: 12px; }
.prog-top .state { font: 600 16px/1.3 var(--font-d); }
.prog-top .pct { margin-left: auto; font: 600 16px/1 var(--font-d); color: var(--accent2); font-variant-numeric: tabular-nums; }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid var(--soft2); border-top-color: var(--accent2);
  animation: spin .8s linear infinite; display: none; flex: none; }
.running .spinner { display: block; }
@keyframes spin { to { transform: rotate(360deg); } }
.bar { height: 10px; background: var(--soft); border-radius: 99px; overflow: hidden; margin: 14px 0 16px; position: relative; }
.bar i { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, var(--accent-deep), var(--accent2)); border-radius: 99px;
  transition: width .6s cubic-bezier(.3,.7,.4,1); overflow: hidden; }
.running .bar i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.28), transparent);
  animation: shimmer 1.6s infinite; transform: translateX(-100%); }
@keyframes shimmer { to { transform: translateX(100%); } }
.waiting .bar i { background: repeating-linear-gradient(-45deg, #b98a2a 0 8px, #d8a53c 8px 16px); background-size: 22px 22px; animation: stripes .8s linear infinite; }
.waiting .bar i::after { display: none; }
@keyframes stripes { to { background-position: 22px 0; } }
.stats4 { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; }
.stat { background: var(--card2); border-radius: 10px; padding: 11px 14px; min-width: 0; }
.stat span { display: block; color: var(--muted); font-size: 12px; }
.stat b { display: block; font: 600 16px/1.35 var(--font-d); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat b.small { font-size: 13.5px; font-weight: 600; }
.wait-box { display: none; margin-top: 12px; padding: 11px 14px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); font-size: 13px; }
.waiting .wait-box { display: flex; gap: 10px; align-items: center; }
.pulse-line { margin-top: 12px; color: var(--muted); font-size: 12.5px; display: flex; align-items: center; gap: 8px; min-height: 18px; }
details.log { margin-top: 14px; }
details.log summary { cursor: pointer; color: var(--muted); font-size: 13px; list-style: none; display: inline-flex; gap: 6px; align-items: center; }
details.log summary::-webkit-details-marker { display: none; }
details.log[open] summary .chev { transform: rotate(180deg); }
details.log pre { margin: 10px 0 0; max-height: 220px; overflow: auto; padding: 12px 14px; background: var(--log-bg); border: 1px solid var(--line);
  border-radius: 10px; font: 12px/1.55 var(--mono); color: var(--ink2); white-space: pre-wrap; user-select: text; }
.result-box { display: none; margin-top: 14px; padding: 12px 14px; border-radius: 10px; font-size: 13.5px; align-items: center; gap: 12px; }
.result-box.ok { display: flex; background: var(--ok-bg); color: var(--ok); }
.result-box.err { display: flex; background: var(--danger-bg); color: var(--danger); }
.result-box .btn { margin-left: auto; }

/* ideas */
.stats-row { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; margin-bottom: 8px; }
.stats-row .stat { background: var(--card); border: 1px solid var(--line); padding: 14px 16px; }
.stats-row .stat b { font-size: 20px; }
.strip { display: grid; grid-auto-flow: column; grid-auto-columns: 158px; gap: 12px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x proximity; }
.item { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; cursor: pointer; scroll-snap-align: start;
  transition: border-color .15s, transform .15s; }
.item:hover { border-color: var(--line2); transform: translateY(-2px); }
.item .img { aspect-ratio: 1; }
.item .meta { padding: 9px 11px 11px; }
.item .meta b { display: block; font-size: 12.5px; font-weight: 600; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .meta span { font-size: 11.5px; color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .rank { position: absolute; top: 8px; left: 8px; font-size: 11px; font-weight: 700; background: var(--rank-bg); color: var(--ink);
  border-radius: 6px; padding: 1px 7px; backdrop-filter: blur(4px); }
.img { position: relative; background: radial-gradient(circle at 50% 40%, var(--img1), var(--img2) 72%); display: grid; place-items: center; overflow: hidden; }
.img img { width: 88%; height: 88%; object-fit: contain; opacity: 0; transition: opacity .3s, transform .3s; }
.img img.loaded { opacity: 1; }
.img .ph { position: absolute; color: var(--ph); }
.img .ph svg { width: 34px; height: 34px; }
.img img.loaded + .ph { display: none; }
.ideas { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 14px; }
.idea { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column;
  transition: border-color .15s; }
.idea:hover { border-color: var(--line2); }
.idea-top { display: grid; grid-template-columns: 132px 1fr; gap: 16px; padding: 16px 16px 0; }
.idea-top .img { border-radius: 10px; aspect-ratio: 1; cursor: zoom-in; }
.idea-top .img:hover img.loaded { transform: scale(1.05); }
.idea-h { min-width: 0; display: flex; flex-direction: column; }
.idea-h .t { display: flex; gap: 10px; align-items: flex-start; }
.num { flex: none; width: 26px; height: 26px; border-radius: 7px; background: var(--accent-dim); color: var(--accent2); display: grid; place-items: center;
  font-weight: 700; font-size: 13px; }
.idea-h h3 { margin: 0; font: 600 16.5px/1.3 var(--font-d); flex: 1; min-width: 0; }
.idea-h h3 span { color: var(--muted); font-weight: 400; }

const PAGES = [
  ["scan", "New scan", "Reads the Roblox bestseller, most-favorited and newest-upload lists, then works out what you could make."],
  ["ideas", "Ideas", "Themes buyers want, on item types without much competition yet."],

  ["momentum", "Momentum", "How themes and items have been selling across your scans. Drag the slider to go back in time."],
  ["history", "History", "Every scan you've run. Scanning every few days shows which themes are climbing."],
  ["settings", "Settings", "Changes are saved automatically."],
  ["help", "How it works", "What the app looks at and what the scores mean."],
];
const SWATCH = {black:"#1d1d1f",white:"#f4f4f4",red:"#d33b3b",blue:"#3a6fd8",green:"#3aa35b",pink:"#ee7fb5",purple:"#8a5cd6",yellow:"#f1c93b",
  orange:"#ef8a33",brown:"#8a5a3b",grey:"#8e8e93",gold:"#d4a72c",silver:"#c0c4cc",cyan:"#35c4d8",teal:"#2a9d8f",navy:"#23355c",beige:"#dccaa6",
  cream:"#f3e8cf",lavender:"#b9a6e8",mint:"#9fe3c4",rainbow:"linear-gradient(90deg,#e44,#f93,#fd3,#4c6,#39f,#96f)",pastel:"linear-gradient(90deg,#fbc,#bdf,#cfc)",
  neon:"#39ff88",blonde:"#f0d58a",ginger:"#c8622c",chrome:"linear-gradient(90deg,#999,#eee,#888)",holographic:"linear-gradient(90deg,#f9c,#9cf,#cf9,#fc9)"};

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const title = s => String(s || "").replace(/\b\w/g, c => c.toUpperCase());
const fmtNum = n => (n ?? 0).toLocaleString("en-US");
function fmtDur(sec) {
  sec = Math.max(0, Math.round(sec));
  if (sec < 60) return `${sec} s`;
  const m = Math.floor(sec / 60), s = sec % 60;
  if (m < 60) return s ? `${m} min ${s} s` : `${m} min`;
  return `${Math.floor(m / 60)} h ${m % 60} min`;
}
function ago(iso) {
  if (!iso) return "never";
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return `${Math.floor(s / 60)} min ago`;
  if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
  const d = Math.floor(s / 86400); return `${d} day${d === 1 ? "" : "s"} ago`;
}

let api = null;
const S = {
  page: null, state: null, scan: null, current: null, currentId: null, search: "",
  run: { running: false, logs: [] },
};

/* ---------- api bridge ---------- */
function call(name, ...args) {
  if (!api || !api[name]) return Promise.resolve(null);
  return api[name](...args).catch(e => { console.error(name, e); toast(`Something went wrong: ${e}`, "err"); return null; });
}
window.__ev = function (ev) { try { onEvent(ev); } catch (e) { console.error(e); } };

/* ---------- ui helpers ---------- */
function toast(msg, kind = "") {
  const t = document.createElement("div");
  t.className = `toast ${kind}`; t.textContent = msg;
  $("#toasts").appendChild(t);
  setTimeout(() => { t.style.transition = "opacity .3s"; t.style.opacity = 0; setTimeout(() => t.remove(), 320); }, 4200);
}
function modal(titleText, text, buttons = [["OK", "primary"]]) {
  return new Promise(res => {
    const o = $("#overlay");
    o.innerHTML = `<div class="modal"><h3>${esc(titleText)}</h3><p>${esc(text)}</p><div class="btns">${
      buttons.map(([l, k], i) => `<button class="btn ${k}" data-i="${i}">${esc(l)}</button>`).join("")}</div></div>`;
    o.classList.add("show");
    const done = v => { o.classList.remove("show"); o.innerHTML = ""; document.removeEventListener("keydown", key); res(v); };
    const key = e => { if (e.key === "Escape") done(null); };
    document.addEventListener("keydown", key);
    o.onclick = e => { if (e.target === o) done(null); };
    o.querySelectorAll("button").forEach(b => b.onclick = () => done(buttons[+b.dataset.i][0]));
  });
}
function modalNotes(titleText, text, notes) {
  return new Promise(res => {
    const o = $("#overlay");
    o.innerHTML = `<div class="modal"><h3>${esc(titleText)}</h3><p>${esc(text)}</p>${notes ? `<div class="notes selectable">${esc(notes)}</div><div style="height:18px"></div>` : ""}
      <div class="btns"><button class="btn primary" id="mn-ok">Nice</button></div></div>`;
    o.classList.add("show");
    const done = () => { o.classList.remove("show"); o.innerHTML = ""; res(); };
    o.onclick = e => { if (e.target === o) done(); };
    $("#mn-ok").onclick = done;
  });
}
function lightbox(item) {
  const o = $("#overlay");
  o.innerHTML = `<div class="lightbox">${imgBox(item.thumb, "", itemId(item))}<div class="lb-b"><div><b>${esc(item.name)}</b>
    <span>${esc(item.type)} · ${esc(item.price)}${item.creator ? " · by " + esc(item.creator) : ""}</span></div>
    <button class="btn primary sm" id="lb-open">${ICON.ext} View on Roblox</button></div></div>`;
  o.classList.add("show");
  wireImages(o);
  const close = () => { o.classList.remove("show"); o.innerHTML = ""; document.removeEventListener("keydown", key); };
  const key = e => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", key);
  o.onclick = e => { if (e.target === o) close(); };
  $("#lb-open").onclick = () => call("open_url", item.url);
}
/* Item pictures: shown straight from Roblox when the scan has a link; if there is no link
   (older scans) or it no longer works, the app fetches the picture itself and keeps a copy. */
const THUMBS = {};
const thumbQueue = new Map();
let thumbTimer = null;
function itemId(it) {
  if (!it) return "";
  if (it.id) return String(it.id);
  const m = String(it.url || "").match(/catalog\/(\d+)/);
  return m ? m[1] : "";
}
function imgBox(url, cls = "", id = "") {
  const src = url || (id && THUMBS[id]) || "";
  return `<div class="img ${cls}" data-id="${esc(id)}">${src ? `<img src="${esc(src)}" alt="" referrerpolicy="no-referrer">` : ""}<div class="ph">${ICON.img}</div></div>`;
}
function setPicture(box, uri) {
  box.querySelector("img")?.remove();
  const im = document.createElement("img");
  im.alt = ""; im.dataset.w = 1; im.dataset.local = 1;
  im.onload = () => im.classList.add("loaded");
  im.src = uri;
  box.prepend(im);
}
function needPicture(box) {
  const id = box.dataset.id;
  if (!id || box.dataset.asked) return;
  if (THUMBS[id]) { setPicture(box, THUMBS[id]); return; }
  box.dataset.asked = 1;
  if (!thumbQueue.has(id)) thumbQueue.set(id, []);
  thumbQueue.get(id).push(box);
  clearTimeout(thumbTimer);
  thumbTimer = setTimeout(flushThumbs, 40);
}
async function flushThumbs() {
  const batch = [...thumbQueue.entries()];
  thumbQueue.clear();
  for (let i = 0; i < batch.length; i += 24) {
    const part = batch.slice(i, i + 24);
    const got = await call("thumbs", part.map(([id]) => id)) || {};
    for (const [id, boxes] of part) {
      if (!got[id]) continue;
      THUMBS[id] = got[id];
      boxes.forEach(b => { if (b.isConnected) setPicture(b, got[id]); });
    }
  }
}
function wireImages(root) {
  root.querySelectorAll(".img").forEach(box => {
    const im = box.querySelector("img");
    if (!im) { needPicture(box); return; }
    if (im.dataset.w) return;
    im.dataset.w = 1;
    if (im.complete && im.naturalWidth) im.classList.add("loaded");
    im.onload = () => im.classList.add("loaded");
    im.onerror = () => { im.remove(); needPicture(box); };
  });
}
function chips(id, options, value, disabled = false) {
  return `<div class="chips" id="${id}">${options.map(([v, l]) =>
    `<button class="chip ${String(v) === String(value) ? "on" : ""}" data-v="${esc(v)}" ${disabled ? "disabled" : ""}>${esc(l)}</button>`).join("")}</div>`;
}
function wireChips(id, cb) {
  const el = document.getElementById(id);
  el.querySelectorAll(".chip").forEach(b => b.onclick = () => {
    el.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === b));
    cb(b.dataset.v);
  });
}
function toggle(id, label, sub, on) {
  return `<div class="toggle ${on ? "on" : ""}" id="${id}"><div class="sw"></div><div><b>${esc(label)}</b>${sub ? `<small>${esc(sub)}</small>` : ""}</div></div>`;
}
function wireToggle(id, cb) {
  const el = document.getElementById(id);
  el.onclick = () => { if (el.classList.contains("disabled")) return; el.classList.toggle("on"); cb(el.classList.contains("on")); };
}
function dropdown(id, label, items) {
  return `<div class="dd" id="${id}"><button class="btn sm">${esc(label)} ${ICON.chev}</button><div class="dd-menu">${
    items.map((it, i) => `<button data-i="${i}" class="${it.sel ? "sel" : ""}">${esc(it.label)}</button>`).join("")}</div></div>`;
}
function wireDropdown(id, items) {
  const dd = document.getElementById(id);
  if (!dd) return;
  dd.querySelector(".btn").onclick = e => { e.stopPropagation(); document.querySelectorAll(".dd.open").forEach(x => x !== dd && x.classList.remove("open")); dd.classList.toggle("open"); };
  dd.querySelectorAll(".dd-menu button").forEach(b => b.onclick = () => { dd.classList.remove("open"); items[+b.dataset.i].fn(); });
}
document.addEventListener("click", () => document.querySelectorAll(".dd.open").forEach(x => x.classList.remove("open")));

/* ---------- navigation ---------- */
function buildNav() {
  const mk = ([key, label]) => `<button data-p="${key}">${ICON[key]}<span>${esc(label)}</span></button>`;
  $("#nav-top").innerHTML = PAGES.slice(0, 5).map(mk).join("");

function show(page) {
  S.page = page;

  $("#h-sub").textContent = p[2];

  document.querySelectorAll(".page").forEach(s => { s.classList.remove("active"); s.style.display = ""; });

  $("#scroll").scrollTop = 0;

/* ---------- state ---------- */
async function refreshState() {
  const st = await call("get_state");
  if (!st) return;
  S.state = st;
  if (!S.currentId || !st.history.find(h => h.id === S.currentId)) {
    S.currentId = st.history[0]?.id || null;
    S.current = null;
  }
  if (S.currentId && !S.current) S.current = await call("get_scan", S.currentId);
  if (st.running && !S.run.running) Object.assign(S.run, st.running, { running: true });
  updateStatus();
  if (st.update) showUpdate(st.update);
}
async function selectScan(id) {
  S.currentId = id;
  S.current = await call("get_scan", id);
  show(S.page);
}
function scanLabel(h) { return `${h.label}  ·  ${h.scope}`; }
function scanPicker(id) {
  const hist = S.state?.history || [];
  if (!hist.length) return "";
  const cur = hist.find(h => h.id === S.currentId) || hist[0];
  return dropdown(id, scanLabel(cur), hist.slice(0, 30).map(h => ({ label: scanLabel(h), sel: h.id === cur.id, fn: () => selectScan(h.id) })));
}
function wirePicker(id) {
  const hist = S.state?.history || [];
  wireDropdown(id, hist.slice(0, 30).map(h => ({ fn: () => selectScan(h.id) })));
}

function updateStatus() {
  const st = S.state; if (!st) return;
  const running = S.run.running;
  $("#st-dot").className = "dot" + (running ? " busy" : "");
  $("#st-status").textContent = running ? (S.run.waitUntil > Date.now() ? "Paused" : "Scanning") : "Idle";
  $("#st-bar").style.display = running ? "block" : "none";
  if (running) $("#st-bar i").style.width = pct() + "%";
  $("#st-last").textContent = ago(st.last_scan);
  const hrs = +st.settings.auto_scan_hours || 0;
  let next = "Off";
  if (hrs) {
    if (running) next = "running";
    else if (!st.last_scan) next = "soon";
    else {
      const left = hrs * 3600 - (Date.now() - new Date(st.last_scan).getTime()) / 1000;
      next = left <= 60 ? "soon" : "in " + fmtDur(left).replace(/ \d+ s$/, "");
    }
  }
  $("#st-next").textContent = next;
  $("#st-scan").disabled = running;
  const ideasBtn = document.querySelector('.nav button[data-p="ideas"]');
  if (ideasBtn) {
    const n = S.current?.ideas?.length || 0;
    let b = ideasBtn.querySelector(".badge");
    if (n && !b) { b = document.createElement("span"); b.className = "badge"; ideasBtn.appendChild(b); }
    if (b) { if (n) b.textContent = n; else b.remove(); }
  }
}

/* ---------- scan page ---------- */
function pct() {
  const r = S.run;
  if (!r.total) return 0;
  return Math.min(100, Math.round(100 * r.done / r.total));
}
function renderScan() {
  const s = S.state.settings, r = S.run, dis = r.running;

      ${toggle("t-blender", "Only items I can make in Blender", "Skips classic 2D shirts, pants and t-shirts.", s.blender_only)}

  <div class="card" id="prog"><div class="card-h">Progress</div><div class="card-b">

    <div class="bar"><i id="pr-bar"></i></div>
    <div class="stats4">
      <div class="stat"><span>Time elapsed</span><b id="pr-el">—</b></div>

      <div class="stat"><span>Requests done</span><b id="pr-req">—</b></div>
      <div class="stat"><span>Working on</span><b class="small" id="pr-step" title="">—</b></div>

  $("#pr-log").textContent = r.logs.join("\n");
  updateEstimate();
  paintProgress();
  if (r.result) showResult(r.result);
}
async function saveScanOpt(patch) {
  const st = await call("save_settings", patch);
  if (st) S.state.settings = st;
  updateEstimate();
}
function updateEstimate() {
  const s = S.state.settings, el = $("#estimate");
  if (!el) return;
  const cats = s.scope === "all" ? 2 : 1, reqs = s.depth * cats * 4 + 1;
  const secs = reqs * (s.gap * 1.18 + 0.7);
  el.textContent = `Takes about ${fmtDur(Math.round(secs / 10) * 10)}: ${reqs} requests, spaced ${s.gap} seconds apart so Roblox doesn't rate-limit you.`;
}
async function startScan(force = false) {
  const r = await call("start_scan", force);
  if (!r) return;
  if (r.confirm) {
    const a = await modal("Scan again already?", r.confirm, [["Cancel", ""], ["Scan anyway", "primary"]]);
    if (a === "Scan anyway") startScan(true);
    return;
  }
  if (r.error) toast(r.error, "err");
}
function paintProgress() {
  const r = S.run, prog = $("#prog");
  if (!prog) return;
  const waiting = r.running && r.waitUntil > Date.now();
  prog.classList.toggle("running", r.running);
  prog.classList.toggle("waiting", waiting);
  const p = pct();
  $("#pr-bar").style.width = (r.running || r.finished ? p : 0) + "%";
  $("#pr-pct").textContent = r.running || r.finished ? p + "%" : "";
  if (!r.running && !r.finished) { $("#pr-pulse").textContent = ""; return; }
  const now = Date.now();
  const elapsed = ((r.finished || now) - r.startTs) / 1000;
  $("#pr-el").textContent = fmtDur(elapsed);
  $("#pr-req").textContent = r.total ? `${Math.min(r.done, r.total)} / ${r.total}` : "—";
  $("#pr-step").textContent = r.label || "Starting…";
  $("#pr-step").title = r.label || "";
  if (r.running) {
    let left;
    const waitLeft = waiting ? (r.waitUntil - now) / 1000 : 0;
    const waitedNow = waiting ? (now - r.waitStart) / 1000 : 0;
    const active = Math.max(1, elapsed - r.waitedTotal - waitedNow);
    if (r.done >= 2) left = (active / r.done) * (r.total - r.done) + waitLeft;
    else left = Math.max(5, r.estimate - elapsed) + waitLeft;
    $("#pr-left").textContent = r.done >= r.total ? "almost done" : "about " + fmtDur(Math.max(3, left));
    $("#pr-state").textContent = waiting ? "Paused by Roblox, will continue on its own" : (r.auto ? "Automatic scan running…" : "Scanning the marketplace…");
    if (waiting) {
      const reason = r.waitReason === "rate_limit" ? "Roblox asked us to slow down." : r.waitReason === "network" ? "Your connection had a hiccup." : "Roblox had a hiccup.";
      $("#pr-wait").innerHTML = `<b>${esc(reason)}</b> Resuming in ${Math.ceil(waitLeft)} s. This is normal and the scan is still running.`;
    }
    const quiet = (now - r.lastActivity) / 1000;
    $("#pr-pulse").innerHTML = waiting ? "" : quiet > 25
      ? `<span class="dot busy"></span>Waiting for Roblox to answer (${Math.round(quiet)} s). Slow responses are normal; it retries on its own.`
      : `<span class="dot busy"></span>Working · last activity ${Math.max(0, Math.round(quiet))} s ago`;
  } else {
    $("#pr-left").textContent = "—";
    $("#pr-pulse").textContent = "";
    $("#pr-state").textContent = r.result ? (r.result.ok ? "Scan complete" : "The scan didn't finish") : "Ready when you are.";
  }
}
function showResult(res) {
  const el = $("#pr-result"); if (!el) return;
  el.className = "result-box " + (res.ok ? "ok" : "err");
  el.innerHTML = `<span>${esc(res.text)}</span>${res.ok ? `<button class="btn primary sm" id="pr-see">See your ideas</button>` : ""}`;
  if (res.ok) $("#pr-see").onclick = () => show("ideas");
}
function addLog(msg) {
  S.run.logs.push(msg);
  if (S.run.logs.length > 400) S.run.logs.shift();
  const el = $("#pr-log");
  if (el) { el.textContent += (el.textContent ? "\n" : "") + msg; el.scrollTop = el.scrollHeight; }
}

/* ---------- events from python ---------- */
function onEvent(ev) {
  const r = S.run;
  switch (ev.type) {
    case "scan_start":
      Object.assign(r, { running: true, finished: 0, auto: ev.auto, startTs: Date.now(), total: ev.total || 0, done: 0, estimate: ev.estimate || 60,
        label: "Starting…", waitUntil: 0, waitedTotal: 0, lastActivity: Date.now(), logs: [], result: null });
      if (S.page === "scan") renderScan(); updateStatus(); break;
    case "progress":
      Object.assign(r, { done: ev.done, total: ev.total, label: ev.page ? `${ev.label} · page ${ev.page} of ${ev.pages}` : ev.label, lastActivity: Date.now() });
      if (r.waitUntil) { r.waitedTotal += Math.max(0, (Math.min(Date.now(), r.waitUntil) - r.waitStart) / 1000); r.waitUntil = 0; }
      paintProgress(); updateStatus(); break;
    case "step":
      Object.assign(r, { label: ev.label, lastActivity: Date.now() }); paintProgress(); break;
    case "wait":
      Object.assign(r, { waitUntil: Date.now() + ev.seconds * 1000, waitStart: Date.now(), waitReason: ev.reason, lastActivity: Date.now() });
      paintProgress(); updateStatus(); break;
    case "log":
      r.lastActivity = Date.now(); addLog(ev.msg); break;
    case "scan_done":
      Object.assign(r, { running: false, finished: Date.now(), done: r.total, waitUntil: 0,
        result: { ok: true, text: `Done in ${fmtDur((Date.now() - r.startTs) / 1000)}. ${ev.n_ideas} ideas are ready.` } });
      S.currentId = ev.id; S.current = null; MOM.data = null;
      refreshState().then(() => { if (ev.go && S.page === "scan") show("ideas"); else if (S.page === "scan") renderScan(); else show(S.page); });
      toast(`Scan finished: ${ev.n_ideas} new ideas.`, "ok"); break;
    case "scan_cancelled":
      Object.assign(r, { running: false, finished: 0, result: { ok: false, text: "Scan cancelled." } });
      if (S.page === "scan") renderScan(); updateStatus(); break;
    case "scan_error":
      Object.assign(r, { running: false, finished: 0, result: { ok: false, text: ev.msg } });
      if (S.page === "scan") renderScan(); updateStatus();
      modal("The scan didn't finish", ev.msg); break;
    case "navigate": show(ev.page); break;
    case "state": refreshState().then(() => S.page && show(S.page)); break;
    case "update": showUpdate(ev.info); break;
    case "update_progress": updateProgress(ev); break;
    case "toast": toast(ev.msg, ev.kind || ""); break;
    case "reveal":
      $(".app").classList.add("revealed");
      setTimeout(() => { $(".app").style.transform = "none"; }, 700);
      revealResolve && revealResolve();
      break;
  }
}

/* ---------- momentum ---------- */
/* Every scan is a point in time. For each theme / item we chart its share of all bestseller
   activity (how much of what's selling it accounts for). The slider scrubs through the scans. */
const MOM = { data: null, loading: false, kind: "themes", range: "all", idx: null, table: false, play: null,
  sel: { themes: [], items: [] }, slot: { themes: {}, items: {} } };
const MOM_SLOTS = 6, DAY = 864e5;
const momPts = () => MOM.data?.points || [];
const momT = i => new Date(momPts()[i]).getTime();
function momWindow() {
  const n = momPts().length; if (!n) return [0, -1];
  const span = { all: Infinity, "30": 30 * DAY, "7": 7 * DAY }[MOM.range];
  let a = 0; const last = momT(n - 1);
  while (a < n - 1 && last - momT(a) > span) a++;
  return [a, n - 1];
}
function momFmtDate(i, long = false) {
  const d = new Date(momPts()[i]);
  return d.toLocaleString("en-GB", long ? { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }
    : { day: "numeric", month: "short" });
}
const momPct = v => v == null ? "—" : (v >= 10 ? v.toFixed(1) : v >= 1 ? v.toFixed(2) : v.toFixed(3).replace(/0$/, "")) + "%";
function momBase(i) {                       // the scan we compare against: ~3 days earlier (or the one before)
  if (i <= 0) return null;
  const want = momT(i) - 3 * DAY; let j = i - 1;
  while (j > 0 && momT(j - 1) >= want) j--;
  return j;
}
function momChange(s, i) {
  const j = momBase(i);
  if (j == null) {                          // only one scan so far: use "today vs this week"
    const m = s.m[i]; return m == null ? null : { mom: m };
  }
  return { d: s.v[i] - s.v[j], from: j, was: s.v[j], now: s.v[i] };
}
function momDeltaHtml(ch) {
  if (!ch) return `<span class="muted">—</span>`;
  if (ch.mom != null) {
    const m = ch.mom;
    return m >= 1.15 ? `<span class="up">▲ ${m.toFixed(1)}×</span>` : m <= 0.87 ? `<span class="down">▼ ${m.toFixed(1)}×</span>` : `<span class="muted">${m.toFixed(1)}×</span>`;
  }
  if (ch.was < 0.001) return ch.now < 0.001 ? `<span class="muted">—</span>` : `<span class="up">▲ New</span>`;
  const rel = 100 * ch.d / ch.was, a = Math.abs(rel);
  const txt = a >= 999 ? "999+%" : (a >= 10 ? Math.round(a) : a.toFixed(1)) + "%";
  return a < 0.5 ? `<span class="muted">same</span>` : rel > 0 ? `<span class="up">▲ ${txt}</span>` : `<span class="down">▼ ${txt}</span>`;
}
const momColor = (kind, key) => MOM.slot[kind][key] ? `var(--s${MOM.slot[kind][key]})` : null;
function momToggle(key) {
  const k = MOM.kind, sel = MOM.sel[k];
  const at = sel.indexOf(key);
  if (at >= 0) { sel.splice(at, 1); delete MOM.slot[k][key]; }
  else {
    if (sel.length >= MOM_SLOTS) { toast(`Up to ${MOM_SLOTS} lines at once. Remove one from the chart first.`); return; }
    const used = new Set(Object.values(MOM.slot[k]));
    let n = 1; while (used.has(n)) n++;
    sel.push(key); MOM.slot[k][key] = n;
  }
  paintMomentum();
}
function momSeries() { return MOM.data?.[MOM.kind] || []; }
function momDefaults() {
  const k = MOM.kind; if (MOM.sel[k].length) return;
  const n = momPts().length - 1;
  momSeries().slice().sort((a, b) => b.v[n] - a.v[n]).slice(0, 4).forEach(s => {
    MOM.sel[k].push(s.key); MOM.slot[k][s.key] = MOM.sel[k].length;
  });
}

function momSpan(ms) {

function momSetIdx(i) {

function momPlay() {

}
function momStop() {

}
function momLegend() {

function momChart() {
  const box = $("#mo-chart"); if (!box) return;
  const k = MOM.kind, list = momSeries(), [a, b] = momWindow(), i0 = MOM.idx;
  const sel = MOM.sel[k].map(key => list.find(s => s.key === key)).filter(Boolean);
  const W = Math.max(320, box.clientWidth), H = box.clientHeight || 310;
  const labels = sel.length && sel.length <= 4;
  const P = { l: 46, r: labels ? 146 : 14, t: 12, b: 26 };
  const t0 = momT(a), t1 = momT(b), span = Math.max(1, t1 - t0);
  const x = i => b === a ? P.l + (W - P.l - P.r) / 2 : P.l + (momT(i) - t0) / span * (W - P.l - P.r);
  let max = 0;
  sel.forEach(s => { for (let i = a; i <= b; i++) max = Math.max(max, s.v[i]); });
  const step = (() => { const raw = Math.max(max, 0.01) / 5, p = 10 ** Math.floor(Math.log10(raw)), f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; })();
  const top = step * Math.max(2, Math.ceil(max * 1.06 / step));
  const y = v => P.t + (1 - v / top) * (H - P.t - P.b);
  MOM.geo = { a, b, x };
  let g = "";
  for (let j = 0; j <= Math.round(top / step); j++) {
    const v = step * j, yy = y(v);
    g += `<line class="${j ? "gl" : "base"}" x1="${P.l}" x2="${W - P.r}" y1="${yy}" y2="${yy}"/>`;
    g += `<text x="${P.l - 8}" y="${yy + 4}" text-anchor="end">${esc(momPct(v).replace(/\.0+%$/, "%"))}</text>`;
  }
  // date ticks: about one every 110px, never two on the same day label
  const want = Math.max(2, Math.floor((W - P.l - P.r) / 110));
  const short = span < 2 * DAY;
  let lastX = -1e9, lastLab = "";
  for (let n = 0; n <= want; n++) {
    const tt = t0 + span * n / want;
    let i = a; for (let j = a; j <= b; j++) if (Math.abs(momT(j) - tt) < Math.abs(momT(i) - tt)) i = j;
    const d = new Date(momPts()[i]);
    const lab = short ? d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }) : d.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
    const xx = x(i);
    if (xx - lastX < 60 || lab === lastLab) continue;
    g += `<text x="${xx}" y="${H - 6}" text-anchor="${xx < P.l + 20 ? "start" : xx > W - P.r - 20 ? "end" : "middle"}">${esc(lab)}</text>`;
    lastX = xx; lastLab = lab;
  }
  // lines
  sel.forEach(s => {
    let d = "";
    for (let i = a; i <= b; i++) d += `${i === a ? "M" : "L"}${x(i).toFixed(1)},${y(s.v[i]).toFixed(1)}`;
    g += `<path class="ln" d="${d}" stroke="${momColor(k, s.key)}"/>`;
  });
  // everything after the slider point is dimmed, so "back then" reads clearly
  const cx = x(i0);
  if (i0 < b) g += `<rect class="future" x="${cx}" y="${P.t - 4}" width="${W - P.r - cx + 2}" height="${H - P.t - P.b + 4}"/>`;
  // end labels (direct labels) for up to 4 lines, nudged apart so they never overlap
  if (labels) {
    const ls = sel.map(s => ({ s, yy: y(s.v[b]) })).sort((p, q) => p.yy - q.yy);
    for (let j = 1; j < ls.length; j++) if (ls[j].yy - ls[j - 1].yy < 15) ls[j].yy = ls[j - 1].yy + 15;
    const over = ls.length ? ls[ls.length - 1].yy - (H - P.b) : 0;
    if (over > 0) ls.forEach(l => l.yy -= over);
    ls.forEach(({ s, yy }) => {
      const nm = k === "themes" ? title(s.name) : s.name;
      g += `<text class="dl" x="${W - P.r + 10}" y="${yy + 4}">${esc(nm.length > 18 ? nm.slice(0, 17) + "…" : nm)}</text>`;
    });
  }
  g += `<line class="cur" x1="${cx}" x2="${cx}" y1="${P.t - 4}" y2="${H - P.b}"/>`;
  sel.forEach(s => g += `<circle class="dot" cx="${cx}" cy="${y(s.v[i0])}" r="5" fill="${momColor(k, s.key)}"/>`);
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Share of bestseller activity over time">${g}</svg>` +
    (sel.length ? `<div class="mo-tip" id="mo-tip"></div>` : `<div class="mo-none" style="position:absolute;inset:40% 0 auto">Pick something from the lists below to chart it.</div>`);
  // readout at the slider point
  const tip = $("#mo-tip");
  if (tip) {
    const rows = sel.map(s => ({ s, v: s.v[i0], ch: momChange(s, i0) })).sort((p, q) => q.v - p.v);
    tip.innerHTML = `<div class="h">${esc(momFmtDate(i0, true))}</div>` + rows.map(({ s, v, ch }) =>
      `<div class="r"><i style="background:${momColor(k, s.key)}"></i><span>${esc(k === "themes" ? title(s.name) : s.name)}</span><b>${momPct(v)}</b><em>${momDeltaHtml(ch)}</em></div>`).join("");
    const tw = tip.offsetWidth || 220;
    tip.style.left = (cx + 14 + tw < W - 4 ? cx + 14 : Math.max(4, cx - 14 - tw)) + "px";
  }
  const when = $("#mo-when"); if (when) when.textContent = momFmtDate(i0, true);
  const pos = $("#mo-pos"); if (pos) pos.textContent = i0 === b ? "Latest scan" : `${ago(momPts()[i0])}`;
  const r = $("#mo-range"); if (r) r.style.setProperty("--fill", b === a ? "100%" : `${100 * (i0 - a) / (b - a)}%`);
}

function momSpark(s, a, i, color) {
  const n = i - a + 1;
  if (n < 2) return `<svg viewBox="0 0 84 26"></svg>`;
  let mx = 0, mn = Infinity;
  for (let j = a; j <= i; j++) { mx = Math.max(mx, s.v[j]); mn = Math.min(mn, s.v[j]); }
  const rg = Math.max(mx - mn, mx * 0.05, 1e-6);
  let d = "";
  for (let j = a; j <= i; j++) d += `${j === a ? "M" : "L"}${(2 + 80 * (j - a) / (n - 1)).toFixed(1)},${(23 - 20 * (s.v[j] - mn) / rg).toFixed(1)}`;
  return `<svg viewBox="0 0 84 26" aria-hidden="true"><path d="${d}" stroke="${color || "var(--muted)"}"/></svg>`;
}
function momLists() {

  const k = MOM.kind, i = MOM.idx, [a] = momWindow(), list = momSeries();
  const rows = list.map(s => ({ s, ch: momChange(s, i) })).filter(r => r.ch && s0(r.s, i));
  function s0(s, i) { return s.v[i] > 0 || (i > 0 && s.v[i - 1] > 0); }

  const rising = rows.filter(r => score(r) > (r.ch.mom != null ? 0.15 : 0)).sort((p, q) => score(q) - score(p)).slice(0, 8);
  const falling = rows.filter(r => score(r) < (r.ch.mom != null ? -0.13 : 0)).sort((p, q) => score(p) - score(q)).slice(0, 8);

  $("#mo-s-down").textContent = falling[0] ? (k === "themes" ? title(falling[0].s.name) : falling[0].s.name) : "—";
  const row = ({ s, ch }) => {
    const col = momPts().length > 1 ? momColor(k, s.key) : null, on = !!col;
    const nm = k === "themes" ? title(s.name) : s.name;

    const lead = k === "items" ? imgBox(null, "", s.id) : `<i class="mk" style="${on ? `background:${col};border-color:${col}` : ""}"></i>`;
    return `<div class="mo-row ${on ? "on" : ""}" data-k="${esc(s.key)}" title="${on ? "Remove from chart" : "Add to chart"}">${lead}
      <div class="nm"><b>${esc(nm)}</b><span>${esc(sub)}</span></div>${momSpark(s, a, i, col)}

  };
  up.innerHTML = rising.map(row).join("") || `<div class="mo-none">Nothing is clearly climbing at this point.</div>`;

  [up, down].forEach(el => {
    el.querySelectorAll(".mo-row").forEach(r => r.onclick = () => {
      if (momPts().length < 2) { if (k === "themes") call("open_url", "https://www.roblox.com/catalog?Keyword=" + encodeURIComponent(r.dataset.k));
        else { const s = list.find(x => x.key === r.dataset.k); s && lightbox({ ...s, thumb: null }); } return; }

}

  const k = e.key.toLowerCase();
  if (k === "n") { e.preventDefault(); show("scan"); }
  else if (k === "r") { e.preventDefault(); if (S.currentId) call("open_report", S.currentId); }
  else if (k === "q") { e.preventDefault(); call("quit_app"); }
  else if (/^[1-6]$/.test(k)) { e.preventDefault(); show(PAGES[+k - 1][0]); }
});
document.addEventListener("contextmenu", e => { if (!e.target.closest(".selectable, pre, input")) e.preventDefault(); });
setInterval(() => { if (S.run.running) paintProgress(); }, 500);
setInterval(updateStatus, 5000);

/* ---------- themes ---------- */
const THEMES = [
  { key: "midnight", label: "Midnight", bg: "#0f1115", side: "#13161b", card: "#1e222a", accent: "#4a86f0", muted: "#3a404c" },
  { key: "sakura", label: "Sakura pink", bg: "#151015", side: "#1a1219", card: "#2a1d28", accent: "#ff5fa2", muted: "#4a3646" },
  { key: "violet", label: "Violet", bg: "#100f16", side: "#15131d", card: "#22202e", accent: "#8b6cff", muted: "#3d3852" },
  { key: "emerald", label: "Emerald", bg: "#0d1311", side: "#111815", card: "#1b2621", accent: "#2fbf7f", muted: "#34443c" },
  { key: "sunset", label: "Sunset", bg: "#14100d", side: "#1a1511", card: "#2a211b", accent: "#ff8a3d", muted: "#4a3c31" },
  { key: "graphite", label: "Graphite", bg: "#111111", side: "#161616", card: "#232323", accent: "#e8e8e8", muted: "#3d3d3d" },
  { key: "daylight", label: "Daylight", bg: "#f4f5f8", side: "#ffffff", card: "#eef0f4", accent: "#3b7cf0", muted: "#cbd1da" },
];
function applyTheme(key) {
  if (!THEMES.find(t => t.key === key)) key = "midnight";
  document.documentElement.dataset.theme = key;
}

/* ---------- startup screen ---------- */
const bootStart = Date.now();
const MANAGED = document.documentElement.dataset.launch === "managed";
let revealResolve = null;
const revealed = new Promise(r => { revealResolve = r; });
function splashStep(pct, text) {
  const b = $("#sp-bar"); if (b) b.style.width = pct + "%";
  const t = $("#sp-step"); if (t && text) t.textContent = text;
  if (MANAGED && api) call("boot_progress", pct, text || "");
}
async function splashDone() {
  if (MANAGED) {
    call("boot_done");
    await Promise.race([revealed, new Promise(r => setTimeout(r, 30000))]);
    await new Promise(r => setTimeout(r, 650));        // let the fade-in finish before any popups
    return;
  }
  splashStep(100, "Ready");
  const wait = Math.max(0, 1400 - (Date.now() - bootStart));
  await new Promise(r => setTimeout(r, wait + 250));
  $("#splash").classList.add("hide");
  setTimeout(() => $("#splash")?.remove(), 600);
}
splashStep(12, "Starting…");

/* ---------- boot ---------- */
async function boot() {
  if (api) return;
  api = window.pywebview.api;
  S.booting = true;
  splashStep(30, "Loading settings…");
  buildNav();
  $("#st-scan").onclick = () => { show("scan"); startScan(); };
  const st = await call("get_state");
  if (st) {
    applyTheme(st.settings.theme);
    $("#sp-ver").textContent = "Version " + st.version;
  }
  splashStep(58, "Reading your scans…");
  await refreshState();
  splashStep(82, "Checking for updates…");
  await new Promise(r => setTimeout(r, 300));
  $("#p-loading").remove();
  show(S.state?.history?.length ? "ideas" : "scan");
  call("ui_ready");
  await splashDone();
  const ju = S.state?.just_updated;
  if (ju) {
    const notes = await call("release_notes", ju);
    await modalNotes(`Updated to version ${ju}`, "UGC Trend Finder installed the new version. Here's what changed:", notes || "Improvements and fixes.");
  }
  S.booting = false;
  if (S.update || S.state?.update) showUpdate(S.update || S.state.update);
}
if (window.pywebview && window.pywebview.api) boot();
else window.addEventListener("pywebviewready", boot);
</script>
</body>
</html>
